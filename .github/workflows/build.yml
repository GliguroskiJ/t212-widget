# Builds the Windows installer and the macOS apps on GitHub's own machines.
# Push a tag like v1.4.0 (or run it manually) → a GitHub Release with all files appears.
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build:ui
      - run: npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: 'dist/*.exe' }

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test            # also runs the macOS app-swap script for real
      - run: npm run build:ui
      - run: npx electron-builder --mac dir --arm64 --x64 --publish never
      - name: Ad-hoc sign, zip and dmg
        run: |
          V=$(node -p "require('./package.json').version")
          for pair in "mac-arm64:arm64" "mac:x64"; do
            dir="${pair%%:*}"; arch="${pair##*:}"
            app="dist/$dir/T212 Widget.app"
            codesign --force --deep --sign - "$app"
            ditto -c -k --keepParent "$app" "dist/T212-Widget-$V-mac-$arch.zip"
            hdiutil create -volname "T212 Widget" -srcfolder "$app" -ov -format UDZO "dist/T212-Widget-$V-mac-$arch.dmg"
          done
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: 'dist/*-mac-*.*' }

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
